name: checador_express
description: Sistema de asistencia laboral multi-empresa con Flutter y Supabase.
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.2.0

  # Security / session
  flutter_secure_storage: ^9.0.0

  # Location & maps (OpenStreetMap via flutter_map)
  geolocator: ^10.0.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

  # UI
  intl: ^0.20.2
  google_fonts: ^8.2.0
  shimmer: ^3.0.0
  animations: ^2.0.0

  # Utils
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
